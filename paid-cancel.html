<!DOCTYPE html>
<html lang="ja">
<head>

  <script>

    gtag('config', 'G-PMRW6LK7YG');

  <style>
    :root {
      --accent: #f97373;
      --accent-dark: #e45454;
      --ink: #111827;
      --muted: #6b7280;
      --border: #ffe4e6;
      --bg-soft: #fff7f8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
      color: var(--ink);
      background: linear-gradient(170deg, #fff0f2 0%, var(--bg-soft) 60%, #fff 100%);
      min-height: 100vh;
      line-height: 1.75;
    }
    main { max-width: 520px; margin: 0 auto; padding: 32px 16px 40px; }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.10);
      text-align: center;
    }
    .sage { width: 96px; height: auto; margin: 0 auto 8px; display: block; }
    h1 { font-size: 20px; margin: 0 0 10px; }
    p { margin: 0 0 12px; font-size: 15px; }
    .muted { color: var(--muted); font-size: 13px; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 16px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), #fb7185);
      color: #fff;
      font-weight: 800;
      font-size: 16px;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(249, 115, 115, 0.35);
      margin: 18px 0 10px;
    }
    .link { color: var(--accent-dark); font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <img class="sage" src="/assets/senin_320.webp" alt="恋愛仙人" />
      <h1>決済はキャンセルされたようじゃ</h1>
      <p>大丈夫じゃ、お金はかかっておらん。<br>無料レポートはそのまま残っておるぞ。</p>
      <p class="muted">完全版は ¥480 から。迷っておるなら、無料レポートを読み返してから決めればよい。</p>
      <a class="btn" href="/chat.html" onclick="track('cancel_back_to_chat')">無料レポートとプランに戻る</a>
      <a class="link" href="/">トップへ戻る</a>

    <p class="muted" style="text-align:center;margin-top:16px;">※ 相談した時と同じ端末・同じブラウザで開くと、無料レポートが表示されるのじゃ。</p>
  </main>
  <script>track('checkout_cancel_view');</script>
