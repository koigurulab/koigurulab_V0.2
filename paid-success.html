<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>完全版レポート生成</title>
  <style>
    :root{
      --bg: #fff7f8;
      --card: #ffffff;
      --ink: #111827;
      --muted:#6b7280;
      --accent:#f97373;
      --accent-dark:#e45454;
      --line:#e5e7eb;
      --shadow: 0 18px 40px rgba(15, 23, 42, 0.18);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      color:var(--ink);
      background: radial-gradient(circle at top left, #ffe6ec, var(--bg) 40%, #ffffff 80%);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      line-height: 1.8;
    }

    .main{
      max-width: 920px;
      margin: 0 auto;
      padding: 22px 16px 40px;
      min-height: 100vh;
    }

    .title{
      font-size: 28px;
      font-weight: 900;
      letter-spacing: .02em;
      margin: 6px 0 14px;
    }
    .subnote{
      color:var(--muted);
      font-size: 12px;
      margin: 0 0 14px;
    }

    .hero{
      display:flex;
      gap: 12px;
      align-items:flex-start;
      margin: 10px 0 14px;
    }
    .hero img{
      width: 88px;
      height: auto;
      flex: 0 0 auto;
      filter: drop-shadow(0 10px 18px rgba(15,23,42,.10));
    }
    .heroBox{
      position: relative;
      background:#fff;
      border:1px solid rgba(248,113,113,0.25);
      border-radius:14px;
      padding:12px 14px;
      box-shadow: 0 10px 26px rgba(15, 23, 42, 0.10);
      line-height:1.6;
      font-weight: 650;
    }
    .heroBox:before{
      content:"";
      position:absolute;
      left:-8px;
      top:18px;
      border-width:8px 8px 8px 0;
      border-style:solid;
      border-color:transparent rgba(248,113,113,0.25) transparent transparent;
    }
    .heroBox:after{
      content:"";
      position:absolute;
      left:-7px;
      top:18px;
      border-width:8px 8px 8px 0;
      border-style:solid;
      border-color:transparent #ffffff transparent transparent;
    }

    .card{
      background: var(--card);
      border:1px solid rgba(248,113,113,0.25);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 14px 14px 18px;
    }

    .status{
      display:flex;
      align-items:center;
      gap: 10px;
      padding: 12px 14px;
      background: #fff3f3;
      border: 1px solid #ffd1d1;
      border-radius: 14px;
      margin-bottom: 12px;
      font-weight: 650;
    }

    .dots{
      display:inline-flex;
      align-items:center;
      gap: 6px;
      margin-left: 6px;
    }
    .dot{
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: rgba(249,115,115,.9);
      opacity: .25;
      animation: blink 1.2s infinite ease-in-out;
    }
    .dot:nth-child(2){ animation-delay: .15s; }
    .dot:nth-child(3){ animation-delay: .30s; }
    @keyframes blink{
      0%, 100%{ opacity:.25; transform: translateY(0); }
      50%{ opacity:1; transform: translateY(-1px); }
    }
    .dots.is-hidden{ display:none; }

    pre{
      white-space: pre-wrap;
      word-break: break-word;
      background: #fff;
      border: 1px solid #ffe4e6;
      padding: 14px;
      border-radius: 14px;
      min-height: 180px;
      margin: 0;
      font-size: 15px;
      line-height: 1.9;
    }

    .actions{
      display:none;
      margin-top: 14px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn{
      padding: 10px 14px;
      border-radius: 999px;
      border: 0;
      background: var(--accent);
      color: white;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(249, 115, 115, 0.35);
    }
    .btn:hover{ background: var(--accent-dark); }
    .btn:disabled{
      opacity: .55;
      cursor: not-allowed;
      box-shadow: none;
    }

    .link{
      color: var(--accent-dark);
      text-decoration: none;
      font-weight: 700;
    }
    .link:hover{ text-decoration: underline; }

    .metaRow{
      display:flex;
      justify-content: space-between;
      gap: 10px;
      align-items:center;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      flex-wrap: wrap;
    }

    @media (max-width: 520px){
      .title{ font-size: 24px; }
      .hero img{ width: 78px; }
      pre{ font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="main">
    <div class="title">完全版を生成中じゃ…</div>
    <p class="subnote">※ 実在の人物とは一切関係ありません。／本サービスは恋愛の整理用コンテンツです。</p>

    <div class="hero">
      <img src="./assets/senin_320.webp" alt="恋愛仙人" />
      <div class="heroBox" id="progress-copy">
        決済は完了したようじゃ。<br>
        いま、仙人が「お主の恋のクセ」「相手との噛み合い」「次の一歩」を、ひとつの完全版に編み直しておる。<br>
        読み終えた頃には、モヤモヤの“正体”が言葉になっておるはずじゃ。少々待っておれ。
      </div>
    </div>

    <div class="card">
      <div id="status" class="status">
        <span id="statusText">完全版を生成しておる…（ページは閉じずに待つのじゃ）</span>
        <span id="dots" class="dots" aria-hidden="true">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </span>
      </div>

      <pre id="out"></pre>

      <div class="actions" id="actions">
        <button class="btn" id="retry">もう一度生成する</button>
        <a class="link" href="/chat.html">チャットへ戻る</a>
      </div>

      <div class="metaRow">
        <div id="tokenHint">token: -</div>
        <div id="retryHint">途中で止まったら「もう一度生成する」を押すのじゃ。（最大2回）</div>
      </div>
    </div>
  </div>

<script>
(function () {
  function safeJsonParse(raw) { try { return JSON.parse(raw); } catch { return null; } }

  // ===== 多重生成抑止（同時実行 + リロード対策）=====
  let isRunning = false;
  const MAX_RETRY = 2;

  function doneKey(token){ return `koi_paid_done_${token}`; }
  function retryKey(token){ return `koi_paid_retry_${token}`; }

  function getRetryCount(token){
    const n = Number(localStorage.getItem(retryKey(token)) || "0");
    return Number.isFinite(n) ? n : 0;
  }
  function incRetryCount(token){
    const n = getRetryCount(token) + 1;
    localStorage.setItem(retryKey(token), String(n));
    return n;
  }
  function setDone(token){
    localStorage.setItem(doneKey(token), "1");
  }
  function isDone(token){
    return localStorage.getItem(doneKey(token)) === "1";
  }
  function resetRetries(token){
    localStorage.removeItem(retryKey(token));
  }

  // ===== 進捗コピーを段階的に切り替えるためのタイマー管理 =====
  let progressTimers = [];

  function clearProgressTimers(){
    progressTimers.forEach(id => clearTimeout(id));
    progressTimers = [];
  }

  function scheduleProgressCopies({ setStatus, setHero }){
    clearProgressTimers();

    setStatus("完全版を生成しておる…（お主の「恋のクセ」と「次の一歩」をまとめ直しておるぞ）");

    progressTimers.push(setTimeout(() => {
      setStatus("まずは全体の骨組みを組んでおる…（章立て・論点を整列中じゃ）");
      setHero("いま、仙人が「お主の恋のクセ」を抽出して、章立てに落としておる。読みやすさも整えるぞ。少々待っておれ。");
    }, 4000));

    progressTimers.push(setTimeout(() => {
      setStatus("お主の“揺れポイント”を言語化しておる…（ここがいちばん効く部分じゃ）");
      setHero("次に「お主の揺れのトリガー」と「相手との噛み合い」を整理しておる。モヤモヤの正体が言葉になるはずじゃ。");
    }, 10000));

    progressTimers.push(setTimeout(() => {
      setStatus("最後に“使える形”へ整形しておる…（文案・まとめ・結びを仕上げ中じゃ）");
      setHero("仕上げに入ったぞ。読み終えた時に『何を大事にするか』が見えるよう、結論まで磨いておる。");
    }, 18000));

    progressTimers.push(setTimeout(() => {
      setStatus("最終チェック中じゃ…（文章の流れ・重複・言い回しを整えておる）");
    }, 28000));
  }

  function loadSummary(token) {
    if (!token) return null;

    const v1 = safeJsonParse(localStorage.getItem(`koi_session_${token}`));
    if (v1 && typeof v1 === "object") {
      if (v1.summaryJson && typeof v1.summaryJson === "object") return v1.summaryJson;
      if (v1.fortune_traits || v1.profile_snapshot || v1.title) return v1;
    }

    const v2 = safeJsonParse(localStorage.getItem(`koi_summaryJson_${token}`));
    if (v2 && typeof v2 === "object") return v2;

    return null;
  }

  async function run(opts = { fromRetry: false }) {
    // 同時実行ガード（ダブルクリック/二重イベント等）
    if (isRunning) return;
    isRunning = true;

    const qs = new URLSearchParams(location.search);
    const token = qs.get("token");
    const sessionId = qs.get("session_id");

    const statusTextEl  = document.getElementById("statusText");
    const dotsEl        = document.getElementById("dots");
    const outEl         = document.getElementById("out");
    const actionsEl     = document.getElementById("actions");
    const retryBtn      = document.getElementById("retry");
    const tokenHint     = document.getElementById("tokenHint");
    const retryHint     = document.getElementById("retryHint");
    const heroBoxEl     = document.getElementById("progress-copy");

    // UI初期化
    actionsEl.style.display = "none";
    dotsEl.classList.remove("is-hidden");

    tokenHint.textContent = "token: " + (token || "-") + " / session_id: " + (sessionId || "-");
    outEl.textContent = "";

    // token/session_id 必須（直アクセス対策）
    if (!token || !sessionId) {
      dotsEl.classList.add("is-hidden");
      statusTextEl.textContent =
        "決済情報が足りんようじゃ…。token と session_id が見当たらん。決済完了ページから開いておるか確認してくれ。";
      actionsEl.style.display = "flex";
      isRunning = false;
      return;
    }

    // リロード等で再実行されるのを抑止（明示的retry以外）
    if (!opts.fromRetry && isDone(token)) {
      dotsEl.classList.add("is-hidden");
      statusTextEl.textContent =
        "この端末では、すでに完全版の生成が完了しておるようじゃ。下の「もう一度生成する」で再生成もできるぞい。";
      const cnt = getRetryCount(token);
      retryHint.textContent = `途中で止まったら「もう一度生成する」を押すのじゃ。（最大2回／現在 ${cnt} 回）`;
      actionsEl.style.display = "flex";
      isRunning = false;
      return;
    }

    // retry上限の制御
    const currentRetry = getRetryCount(token);
    retryHint.textContent = `途中で止まったら「もう一度生成する」を押すのじゃ。（最大2回／現在 ${currentRetry} 回）`;
    if (currentRetry >= MAX_RETRY) {
      retryBtn.disabled = true;
      retryHint.textContent = `再生成回数の上限（${MAX_RETRY}回）に達したようじゃ。時間をおいて再度お試しください。`;
    } else {
      retryBtn.disabled = false;
    }

    // 先にサーバ側で Stripe 決済を検証
    statusTextEl.textContent = "決済を確認しておる…（少々待つのじゃ）";
    dotsEl.classList.remove("is-hidden");

    try {
      const vres = await fetch("/api/verify-paid", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, token }),
      });

      const vdata = await vres.json().catch(() => null);

      if (!vres.ok || !vdata || vdata.ok !== true) {
        dotsEl.classList.add("is-hidden");
        statusTextEl.textContent =
          "まだ購入が確認できんかった…。決済が完了しておらんか、検証に失敗したようじゃ。";
        outEl.textContent =
          "\n\n---\n[verify-paid]\n" + JSON.stringify(vdata || { error: "verify failed" }, null, 2);
        actionsEl.style.display = "flex";
        isRunning = false;
        return;
      }
    } catch (e) {
      dotsEl.classList.add("is-hidden");
      statusTextEl.textContent =
        "決済検証に失敗したようじゃ。通信状況を確認して、もう一度試してくれ。";
      outEl.textContent += "\n\n---\n[verify-paid error]\n" + String(e);
      actionsEl.style.display = "flex";
      isRunning = false;
      return;
    }

    // ★ログは token 取得後
    console.log("token:", token);
    console.log("session_id:", sessionId);
    if (token) {
      console.log("koi_session:", localStorage.getItem(`koi_session_${token}`));
      console.log("koi_summaryJson:", localStorage.getItem(`koi_summaryJson_${token}`));
    }

    // 離脱防止コピー（生成前に開始）
    scheduleProgressCopies({
      setStatus: (t) => { statusTextEl.textContent = t; },
      setHero:   (t) => { if (heroBoxEl) heroBoxEl.innerHTML = String(t).replace(/\n/g, "<br>"); }
    });
    dotsEl.classList.remove("is-hidden");

    const summaryJson = loadSummary(token);
    if (!summaryJson) {
      clearProgressTimers();
      dotsEl.classList.add("is-hidden");
      statusTextEl.textContent =
        "このブラウザにデータが見当たらん…。決済前に使っていたのと同じ端末・同じブラウザで開いておるか確認してくれ。";
      actionsEl.style.display = "flex";
      isRunning = false;
      return;
    }

    try {
      const res = await fetch("/api/paid-report", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(summaryJson),
      });

      if (!res.ok) {
        const t = await res.text().catch(() => "");
        throw new Error(t || ("HTTP " + res.status));
      }
      if (!res.body) throw new Error("stream body missing");

      const reader = res.body.getReader();
      const decoder = new TextDecoder("utf-8");

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        outEl.textContent += decoder.decode(value, { stream: true });
      }

      clearProgressTimers();
      dotsEl.classList.add("is-hidden");
      statusTextEl.textContent = "完成じゃ。ゆっくり読んでいくがよい。";

      // ✅ 完了フラグ（リロードで再生成されない）
      setDone(token);
      // 成功したらretry回数をリセット（任意：運用が楽）
      resetRetries(token);

    } catch (e) {
      clearProgressTimers();
      dotsEl.classList.add("is-hidden");
      statusTextEl.textContent = "生成に失敗したようじゃ。もう一度試してみよ。";
      outEl.textContent += "\n\n---\n[error]\n" + String(e);
      actionsEl.style.display = "flex";
    } finally {
      isRunning = false;
    }

    // retry（同じtokenで再実行）
    retryBtn.onclick = async () => {
      if (!token) return;

      const cnt = getRetryCount(token);
      if (cnt >= MAX_RETRY) {
        retryBtn.disabled = true;
        const statusTextEl2 = document.getElementById("statusText");
        const retryHint2 = document.getElementById("retryHint");
        if (retryHint2) retryHint2.textContent = `再生成回数の上限（${MAX_RETRY}回）に達したようじゃ。時間をおいて再度お試しください。`;
        if (statusTextEl2) statusTextEl2.textContent = "これ以上の再生成はできんようじゃ（上限に到達）。";
        return;
      }

      // retryカウントを増やしてから再実行
      const next = incRetryCount(token);
      const retryHintEl = document.getElementById("retryHint");
      if (retryHintEl) retryHintEl.textContent = `途中で止まったら「もう一度生成する」を押すのじゃ。（最大2回／現在 ${next} 回）`;

      // 再実行（fromRetry扱いにする）
      await run({ fromRetry: true });
    };
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => run({ fromRetry: false }));
  } else {
    run({ fromRetry: false });
  }
})();
</script>
</body>
</html>
