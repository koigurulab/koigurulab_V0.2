<script>
(function () {
  const qs = new URLSearchParams(location.search);
  const token = qs.get("token");
  const statusEl = document.getElementById("status");
  const outEl = document.getElementById("out");
  const actionsEl = document.getElementById("actions");
  const retryBtn = document.getElementById("retry");

  function safeJsonParse(raw) {
    try { return JSON.parse(raw); } catch { return null; }
  }

  function loadSummary() {
    if (!token) return null;

    // 1) 現行（chat.html が保存している想定）
    const v1 = safeJsonParse(localStorage.getItem(`koi_session_${token}`));
    // koi_session_{token} が { summaryJson, profile, history } の形なら summaryJson を返す
    if (v1 && typeof v1 === "object") {
      if (v1.summaryJson && typeof v1.summaryJson === "object") return v1.summaryJson;
      // もし中身が summaryJson そのものだった場合にも対応
      if (v1.fortune_traits || v1.profile_snapshot || v1.title) return v1;
    }

    // 2) 旧実装互換（候補を順に探す）
    const candidates = [
      `koiguru_paid_summary_${token}`,
      `koi_summaryJson_${token}`,
      `koi_paid_summary_${token}`,
    ];
    for (const key of candidates) {
      const obj = safeJsonParse(localStorage.getItem(key));
      if (obj && typeof obj === "object") return obj;
    }

    return null;
  }

  async function run() {
    const summaryJson = loadSummary();
    if (!summaryJson) {
      statusEl.textContent =
        "このブラウザにデータが見当たらん…。chat.html を開いていたのと同じURL（ドメイン）で戻ってきているか、localStorage のキー名が一致しているかを確認してくれ。";
      actionsEl.style.display = "block";
      return;
    }

    statusEl.textContent = "完全版を生成しておる…（ページは閉じずに待つのじゃ）";
    outEl.textContent = "";

    try {
      const res = await fetch("/api/paid-report", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(summaryJson),
      });
      if (!res.ok) {
        const t = await res.text();
        throw new Error(t);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder("utf-8");
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        outEl.textContent += decoder.decode(value, { stream: true });
      }
      statusEl.textContent = "完成じゃ。ゆっくり読んでいくがよい。";
    } catch (e) {
      statusEl.textContent = "生成に失敗したようじゃ。もう一度試してみよ。";
      outEl.textContent += "\n\n---\n[error]\n" + String(e);
      actionsEl.style.display = "block";
    }
  }

  retryBtn.addEventListener("click", run);
  run();
})();
</script>
